[package]
name = "portable_file_time"
version = "0.1.0"
edition = "2021"
description = "360: Windows file timestamp scanner and Office metadata synchronizer"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
tempfile = "3.13"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
